<div class="dialog-title">
  <h2 mat-dialog-title>{{dialogTitle}}</h2>

  <button mat-icon-button (click)="clickOnCancel()" aria-label="Close dialog">
    <mat-icon>close</mat-icon>
  </button>
</div>

<form [formGroup]="form" (ngSubmit)="clickOnOk()">
  <mat-dialog-content class="dialog-content">

    <mat-form-field class="full-width">
      <mat-label>Project name</mat-label>
      <input matInput formControlName="name"/>
      @if (submitAttempted && form.controls.name.invalid) {
        <mat-error>Name is required.</mat-error>
      }
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Project description</mat-label>
      <textarea
        matInput
        formControlName="description"
        cdkTextareaAutosize
        cdkAutosizeMinRows="3"
        cdkAutosizeMaxRows="8"
      >
      </textarea>
    </mat-form-field>

  </mat-dialog-content>

  <mat-dialog-actions>
    <button matButton type="button" (click)="clickOnCancel()">Cancel</button>
    <button
      matButton type="submit"
      [disabled]="form.invalid"
      cdkFocusInitial
    >
      {{primaryButtonLabel}}
    </button>
  </mat-dialog-actions>
</form>
