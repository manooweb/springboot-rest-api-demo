<section class="page">
  <header class="page-header">
    <h2 class="page-title">{{ 'projects.title.list' | translate }}</h2>
  </header>

  <div class="page-status">
    @if (loading) {
      <mat-card class="status-card status-info">
        <mat-card-content>
          {{ 'projects.state.loading' | translate }}
        </mat-card-content>
      </mat-card>
    }

    @if (error) {
      <mat-card class="status-card status-error">
        <mat-card-content>
          {{ error }}
        </mat-card-content>
      </mat-card>
    }
  </div>

  <div class="page-actions">
    <button matButton="outlined" color="primary" (click)="openAddNewProjectDialog()">
      <mat-icon>add</mat-icon>
      {{ 'projects.action.add' | translate }}
    </button>
  </div>

  <div class="page-content">
    <mat-list class="item-list">
      @for (project of projects; track project.id; let odd = $odd; let last = $last) {
        <mat-list-item [class.alt-row]="odd">
          <span matListItemTitle>{{ project.name }}</span>
          <span matListItemLine>{{ project.description }}</span>

          <span matListItemMeta class="item-meta">
            <button
              mat-icon-button
              class="icon-action"
              (click)="openEditProjectDialog(project)"
              aria-label="{{ 'projects.action.editAria' | translate }}"
            >
              <mat-icon>edit</mat-icon>
            </button>

            <button
              mat-icon-button
              class="icon-action"
              (click)="showProjectDetail(project.id)"
              aria-label="{{ 'projects.action.openAria' | translate }}"
            >
              <mat-icon>visibility</mat-icon>
            </button>

            <button
              mat-icon-button
              class="icon-action"
              (click)="openDeleteProjectConfirmDialog(project)"
              aria-label="{{ 'projects.action.deleteAria' | translate }}"
            >
              <mat-icon>delete_forever</mat-icon>
            </button>
          </span>
        </mat-list-item>
        @if (!last) {
          <mat-divider></mat-divider>
        }
      }
    </mat-list>
  </div>
</section>
