<mat-toolbar color="primary" class="app-toolbar">
  <h1 class="app-toolbar__title">{{ 'app.title' | translate }}</h1>


  <div class="app-toolbar__actions">
    @if (auth.isLoggedIn()) {
    <a mat-button routerLink="/projects" routerLinkActive="active-link">
      {{ 'app.nav.projects' | translate }}
    </a>
    }

    <button matButton="outlined" (click)="onAuthAction()">
      {{ authActionLabel | translate }}
    </button>
  </div>
</mat-toolbar>

<div class="app-container">
  <router-outlet></router-outlet>
</div>

<footer class="app-footer">
  <div class="app-footer__inner">
    <span class="app-footer__muted">
      © {{ copyrightStartYear }} - {{ copyrightEndYear }} Manooweb
    </span>
    <nav class="app-footer__links" aria-label="Legal links">
      <a routerLink="/legal-notice">{{ 'legal.legal-notice.link.label' | translate }}</a>
      <span class="app-footer__muted">•</span>
      <a routerLink="/privacy-policy">{{ 'legal.privacy-policy.link.label' | translate }}</a>
    </nav>
  </div>
</footer>
