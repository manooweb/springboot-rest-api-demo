name: SonarQube

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  sonarqube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

#      - name: Setup Node.js
#        uses: actions/setup-node@v4
#        with:
#          node-version: "20"
#          cache: "npm"
#          cache-dependency-path: frontend/package-lock.json
#
#      - name: Install frontend dependencies
#        working-directory: frontend
#        run: npm ci

      - name: Build backend (for analysis)
        run: |
          ./backend/mvnw -B -f backend clean verify

      - name: SonarQubeCloud Analysis
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=manooweb_springboot-rest-api-demo
            -Dsonar.organization=manooweb
            -Dsonar.projectBaseDir=.
            -Dsonar.sources=backend/src/main/java
            -Dsonar.tests=backend/src/test/java
            -Dsonar.java.binaries=backend/target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
            -Dsonar.verbose=true

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
