name: SonarQube

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  sonarqube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend (for analysis)
        run: |
          ./backend/mvnw -B -f backend clean verify

      - name: Sonar backend (Maven)
        working-directory: backend
        run: |
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=manooweb \
            -Dsonar.projectKey=manooweb_springboot-rest-api-demo-backend \
            -Dsonar.sources=src/main/java,src/main/resources \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.exclusions=src/main/resources/db/migration/**
