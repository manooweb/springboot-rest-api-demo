name: Backend - Build & Unit tests

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, verify & analyze backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./backend/mvnw -f backend verify sonar:sonar
          -Dsonar.projectKey=manooweb_springboot-rest-api-demo  
          -Dsonar.organization=manooweb
          -Dsonar.host.url=https://sonarcloud.io
