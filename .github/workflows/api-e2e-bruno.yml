name: API E2E - Bruno

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  api-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Pull PostgreSQL image
        run: |
          for i in 1 2 3; do
            echo "Pulling postgres:17 (attempt $i/3)..."
            if docker pull postgres:17; then
              echo "Image pulled successfully"
              exit 0
            fi
            echo "docker pull failed, retrying in 10s..."
            sleep 10
          done
          echo "Failed to pull postgres:17 after 3 attempts"
          exit 1

      - name: Start PostgreSQL (Docker Compose)
        run: docker compose up -d --pull never db

      - name: Wait for PostgreSQL healthcheck
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect -f '{{json .State.Health.Status}}' springboot-demo-db 2>/dev/null || true)
            if [ "$STATUS" = "\"healthy\"" ]; then
              echo "PostgreSQL is healthy"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30) status=$STATUS"
            sleep 2
          done
          echo "PostgreSQL did not become healthy in time"
          docker compose logs db
          exit 1

      - name: Backend - build (skip tests)
        run: ./backend/mvnw -f backend -DskipTests package

      - name: Backend - start app (dev profile)
        env:
          SPRING_PROFILES_ACTIVE: dev
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: demo
          PGUSER: demo
          PGPASSWORD: demo
          APP_USER_NAME: demo@example.com
          APP_USER_PASSWORD: demo
          APP_SECURITY_JWT_ISSUER: http://localhost:8080
          APP_SECURITY_JWT_SECRET: ci-test-secret-at-least-32-characters
        run: |
          nohup ./backend/mvnw -f backend -q spring-boot:run > springboot.log 2>&1 &
          echo $! > springboot.pid

      - name: Wait for API health endpoint
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:8080/api/v1/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting for API... ($i/40)"
            sleep 2
          done
          echo "API did not start in time"
          echo "----- Spring Boot logs -----"
          tail -n 200 springboot.log || true
          exit 1

      - name: Install Node dependencies
        run: npm ci

      - name: Run Bruno E2E tests
        run: npm run test:api

      - name: Show Spring Boot logs on failure
        if: failure()
        run: tail -n 200 springboot.log || true

      - name: Teardown
        if: always()
        run: |
          if [ -f springboot.pid ]; then
            kill "$(cat springboot.pid)" || true
          fi
          docker compose down -v
